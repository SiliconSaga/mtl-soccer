name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level grants; the deploy job alone carries contents: write to
# push the built site to gh-pages.
permissions: {}

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
    uses: SiliconSaga/volundr/.github/workflows/jekyll-deploy.yml@main
