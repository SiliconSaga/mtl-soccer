name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# No workflow-level grants; the preview job alone carries what the reusable
# workflow needs: contents to publish previews to gh-pages, pull-requests for
# the sticky comments, pages to read the served-domain configuration.
permissions: {}

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  preview:
    permissions:
      contents: write
      pull-requests: write
      pages: read
    uses: SiliconSaga/volundr/.github/workflows/pr-preview.yml@main
