<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTL Middle School Hockey 2026–27 — Registration Flyer</title>
<link rel="stylesheet" href="flyer.css">
</head>
<body>
<div class="flyer">
  <div class="crest"><img src="../assets/mtl-logo.png" alt="Mountain Top League, West Orange"></div>
  <div class="banner-gold" style="font-size:30px; margin-top:6px;">Mountain Top League</div>
  <h1 class="headline" style="font-size:84px;">MIDDLE SCHOOL<br>HOCKEY</h1>
  <div class="banner-gold">Registration Now Open!</div>
  <div class="season">2026–27 Season</div>
  <div class="photo-band">
    <img class="team" src="../assets/team-ms.jpg" alt="MTL middle school hockey team">
    <div class="qr-box">
      <div class="scan">Scan to Register</div>
      <img src="../assets/qr-hockey.png" alt="QR code: mountaintopleague.com/hockey">
    </div>
  </div>
  <div class="divisions" style="justify-content:center;">
    <div class="division-card" style="flex:0 1 70%;">
      <h3>Middle School</h3>
      <div class="ages">Birth Years 2012–2015 · Grades 6–8</div>
      <div class="fee">$400</div>
      <ul>
        <li>10-Game Montclair State Middle School League</li>
      </ul>
    </div>
  </div>
  <div class="accent-bar"></div>
  <div class="footer-strip">
    <strong>Register at mountaintopleague.com/hockey</strong> &nbsp;·&nbsp; Questions: <strong>mountaintop.hockey@gmail.com</strong>
  </div>
</div>
</body>
</html>
