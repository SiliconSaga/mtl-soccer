title: MTL Soccer
description: >-
  MTL Soccer is part of the Mountain Top League, an all-volunteer organization
  serving the children of West Orange, NJ since 1959.
# Served at the soccer subdomain (CNAME file): the site lives at the domain
# root, so baseurl stays empty and all internal links resolve from /.
url: "https://soccer.mountaintopleague.com"
baseurl: ""

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
